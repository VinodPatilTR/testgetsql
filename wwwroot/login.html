<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TCTool Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0c10; --surface: #111318; --border: #1e2230;
      --accent: #00e5ff; --accent2: #7b61ff; --danger: #ff5370;
      --text: #e8eaf0; --muted: #6b7280;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background-image:
        radial-gradient(ellipse 70% 50% at 20% 20%, rgba(0,229,255,.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(123,97,255,.07) 0%, transparent 60%);
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 400px;
      box-shadow: 0 0 60px rgba(0,229,255,.06);
    }
    .logo {
      font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle { font-size: 11px; color: var(--muted); margin-bottom: 36px; text-transform: uppercase; letter-spacing: .1em; }
    label { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; }
    input[type="password"] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 16px; color: var(--text);
      font-family: 'DM Mono', monospace; font-size: 14px; outline: none;
      transition: border-color .2s; margin-bottom: 20px;
    }
    input[type="password"]:focus { border-color: var(--accent); }
    .error {
      background: rgba(255,83,112,.1); border: 1px solid rgba(255,83,112,.3);
      border-radius: 8px; padding: 10px 14px; color: var(--danger);
      font-size: 12px; margin-bottom: 20px; display: none;
    }
    button {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 8px; color: #000;
      font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: opacity .2s; letter-spacing: .04em;
    }
    button:hover { opacity: .88; }
    button:disabled { opacity: .5; cursor: default; }
    .lock { text-align: center; margin-bottom: 28px; opacity: .3; }
  </style>
</head>
<body>
  <div class="card">
    <div class="lock">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <div class="logo">TCTool</div>
    <div class="subtitle">Config Dashboard · Secure Access</div>
    <div class="error" id="errorBox"></div>
    <form id="loginForm">
      <label for="password">App Password</label>
      <input type="password" id="password" name="password" placeholder="Enter access password" autofocus/>
      <label for="db_password">Database Password</label>
      <input type="password" id="db_password" name="db_password" placeholder="Enter database password"/>
      <button type="submit" id="submitBtn">Sign In →</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      errorBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            appPassword: document.getElementById('password').value,
            dbPassword: document.getElementById('db_password').value
          })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/';
        } else {
          errorBox.textContent = data.error || 'Login failed.';
          errorBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Sign In →';
        }
      } catch (err) {
        errorBox.textContent = 'Network error. Please try again.';
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In →';
      }
    });
  </script>
</body>
</html>
